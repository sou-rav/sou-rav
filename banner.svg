<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9b9c3"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2997ff"/>
      <stop offset="0.5" stop-color="#a259ff"/>
      <stop offset="1" stop-color="#ff5e8a"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="32"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <circle cx="260" cy="60" r="160" fill="#2997ff" opacity="0.35" filter="url(#blur)"/>
    <circle cx="620" cy="420" r="170" fill="#a259ff" opacity="0.30" filter="url(#blur)"/>
    <circle cx="980" cy="80" r="150" fill="#ff5e8a" opacity="0.28" filter="url(#blur)"/>
    <rect x="0.5" y="0.5" width="1199" height="419" rx="32" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="215" font-size="112" font-weight="700" letter-spacing="-3" fill="url(#name)">Sourav</text>
    <text x="600" y="272" font-size="34" font-weight="500" fill="#d2d2d7">Full-Stack Web Developer</text>
    <rect x="540" y="302" width="120" height="4" rx="2" fill="url(#line)"/>
    <text x="600" y="356" font-size="20" font-weight="400" letter-spacing="1" fill="#86868b">HTML  ·  CSS  ·  JavaScript  ·  React  ·  Node.js  ·  MongoDB</text>
  </g>
</svg>
